<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>GoGo — стартовая страница</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/tiles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg" id="bg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="orb orb4"></div>
  </div>

  <header>
    <div class="logo">Go<span>Go</span></div>
    <input id="search" type="search" placeholder="Поиск вкладки..." autocomplete="off">
    <div class="header-right">
      <div class="settings-wrap">
        <button id="settingsBtn" class="settings-btn" title="Настройки">⚙</button>
        <div id="settingsPanel" class="settings-panel" hidden>
          <h3>Настройки</h3>
          <label>Тема
            <div id="themePicker" class="theme-picker-inline">
              <button id="themeBtn" class="theme-btn-inline" title="Фон" aria-haspopup="listbox">
                <span id="themeBtnSwatch" class="theme-btn-swatch"></span>
                <span id="themeBtnLabel">Градиент</span>
              </button>
              <div id="themeMenu" class="theme-menu-inline" role="listbox" hidden></div>
            </div>
          </label>
          <label>Колонок
            <div class="delay-spin">
              <input type="number" id="gridCols" min="1" max="12" value="6">
              <div class="spin-btns">
                <button type="button" class="spin-up grid-spin-up">▲</button>
                <button type="button" class="spin-down grid-spin-down">▼</button>
              </div>
            </div>
          </label>
          <label>Размер плиток
            <select id="tileSize">
              <option value="large">Большие</option>
              <option value="medium" selected>Средние</option>
              <option value="small">Маленькие</option>
            </select>
          </label>
          <hr>
          <button id="exportBtn">📤 Экспорт закладок</button>
          <button id="importBtn">📥 Импорт закладок</button>
          <input type="file" id="importFile" accept=".json,application/json" hidden>
        </div>
      </div>
    </div>
  </header>

  <main id="content"></main>

  <div id="ctxMenu" class="ctx-menu" hidden></div>
  <div id="toast" class="toast"></div>

  <div id="addModal" class="modal-overlay" hidden>
    <div class="modal">
      <h3 id="addModalTitle">Новая закладка</h3>
      <form id="addForm" novalidate>
        <label id="urlLabel">
          <span>URL</span>
          <input type="text" id="newUrl" placeholder="https://example.com" autocomplete="off">
        </label>
        <label>
          <span>Название</span>
          <input type="text" id="newTitle" placeholder="Пусто = домен сайта" autocomplete="off">
        </label>
        <div class="modal-actions">
          <button type="button" id="addCancel" class="btn-cancel">Отмена</button>
          <button type="submit" class="btn-ok">Добавить</button>
        </div>
      </form>
    </div>
  </div>

  <div id="imageModal" class="modal-overlay" hidden>
    <div class="modal">
      <h3>Установить изображение</h3>
      <label>
        <span>Ссылка на изображение</span>
        <input type="text" id="imageUrl" placeholder="https://example.com/photo.jpg" autocomplete="off">
      </label>
      <div class="image-modal-or">или</div>
      <button type="button" id="imageFileBtn" class="btn-file">Выбрать файл с диска</button>
      <input type="file" id="imageFileInput" accept="image/*" hidden>
      <div class="image-modal-or">или</div>
      <div class="screenshot-row">
        <button type="button" id="imageScreenshotBtn" class="btn-file">Сделать скриншот</button>
        <div class="screenshot-delay">
          <div class="delay-spin">
            <input type="number" id="screenshotDelay" min="1" max="30" value="5">
            <div class="spin-btns">
              <button type="button" class="spin-up" id="spinUp">▲</button>
              <button type="button" class="spin-down" id="spinDown">▼</button>
            </div>
          </div>
          <span>сек</span>
        </div>
      </div>
      <div id="imagePreview" class="image-preview" hidden>
        <img id="imagePreviewImg">
      </div>
      <div class="modal-actions">
        <button type="button" id="imageCancel" class="btn-cancel">Отмена</button>
        <button type="button" id="imageApply" class="btn-ok">Установить</button>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
